<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprinkler Progress Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10161E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<style>
  html,body{margin:0;padding:0;background:#F2F4F3;-webkit-text-size-adjust:100%}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --sheet:#F2F4F3; --surface:#FFFFFF; --ink:#10161E; --muted:#6B7785;
    --rule:#1B2430; --hair:#C9D0D6; --red:#C8342B; --amber:#F2B01E; --green:#1F7A4C; --bare:#FFFFFF;
    --plan:#185FA5; --act:#D85A30; --burn:#0E7C5A; --fillplan:rgba(24,95,165,.10);
    --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;    --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  .chartwrap{background:var(--surface);border:1px solid var(--hair);padding:6px}
  .axl{font-family:var(--mono);font-size:9px;fill:var(--muted)}
  .sched{border:1px solid var(--hair);background:var(--sheet);padding:8px;margin-bottom:6px}
  .sched .pnm{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
  .mini{font-family:var(--disp);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
  .tbx{font-family:var(--body);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);max-width:1100px;margin:0 auto}

  .pbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--ink)}
  .psel{flex:1;min-width:0;font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:7px 28px 7px 9px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .psel:focus{outline:2px solid var(--red);outline-offset:1px}
  .pbar .btn{background:var(--surface)}

  .mlist{border:1px solid var(--hair);background:var(--surface);margin-bottom:10px}
  .mrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--hair)}
  .mrow:last-child{border-bottom:none}
  .mrow .mname{flex:1;font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .msub{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .mact{display:grid;gap:6px;margin-bottom:10px}

  .tb-head{border-bottom:1px solid var(--rule)}
  .tb-fields{display:flex;flex-wrap:wrap}
  .tb-f{flex:1 1 120px;padding:8px 12px;border-right:1px solid var(--hair);min-width:0}
  .tb-f:last-child{border-right:none}
  .tb-f .k{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
  .tb-f .v{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-bar{display:flex;align-items:stretch;border-top:1px solid var(--rule);background:var(--surface)}
  .tb-meter{flex:1;position:relative;background:#E4E8EA;min-height:44px}
  .tb-fill{position:absolute;inset:0 auto 0 0;background:var(--red);transition:width .45s cubic-bezier(.4,0,.2,1)}
  .tb-meter-lab{position:absolute;inset:0;display:flex;align-items:center;padding:0 12px;font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
  .tb-pct{display:flex;align-items:baseline;gap:2px;padding:6px 14px;border-left:1px solid var(--rule);background:var(--surface)}
  .tb-pct b{font-family:var(--disp);font-size:34px;font-weight:700;line-height:1}
  .tb-pct i{font-family:var(--disp);font-size:15px;font-style:normal;font-weight:600;color:var(--muted)}

  .tabs{display:flex;border-bottom:1px solid var(--rule);background:var(--sheet)}
  .tab{flex:1;padding:11px 6px;background:none;border:none;border-right:1px solid var(--hair);cursor:pointer;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tab:last-child{border-right:none}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--sheet)}
  .tab:focus-visible{outline:2px solid var(--red);outline-offset:-3px}
  .pane{padding:14px}

  /* area pills */
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .pill{padding:6px 11px;border:1px solid var(--hair);background:var(--surface);cursor:pointer;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:7px;align-items:baseline}
  .pill b{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--muted)}
  .pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
  .pill[aria-pressed="true"] b{color:var(--amber)}
  .pill:focus-visible{outline:2px solid var(--red);outline-offset:1px}
  .kindtag{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:1px 4px;border:1px solid var(--hair)}

  .area-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
  .area-h h3{font-family:var(--disp);font-size:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0}
  .area-h .ap{font-family:var(--mono);font-size:13px;font-weight:600}

  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .grid{border-collapse:separate;border-spacing:0;width:100%;min-width:420px}
  .grid th,.grid td{padding:0;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .grid thead th{background:var(--sheet);position:sticky;top:0;z-index:2;border-bottom:1px solid var(--rule);font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:7px 4px;text-align:center;line-height:1.15}
  .grid thead th .w{display:block;font-family:var(--mono);font-size:9px;color:var(--hair);font-weight:400}
  .lvl{position:sticky;left:0;z-index:1;background:var(--sheet);border-right:1px solid var(--rule)!important;font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:0 10px!important;text-align:left;white-space:nowrap}
  thead .lvl{z-index:3}
  .cell{width:100%;height:38px;border:none;cursor:pointer;background:var(--bare);position:relative;display:block;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted)}
  .cell:focus-visible{outline:2px solid var(--red);outline-offset:-2px;z-index:4}
  .cell .bar{position:absolute;inset:0 auto 0 0;opacity:.9}
  .cell .txt{position:relative;z-index:1}
  .cell[data-s="done"]{background:var(--green);color:#fff}
  .cell[data-s="blocked"]{background:var(--red);color:#fff}
  .cell[data-s="ip"] .bar{background:var(--amber)}
  .cell[data-s="ip"]{color:var(--ink)}
  .cell .flag{position:absolute;top:2px;right:3px;z-index:2;font-size:9px;line-height:1}
  .rowpct{font-family:var(--mono);font-size:12px;font-weight:600;text-align:right;padding:0 8px!important;white-space:nowrap;background:var(--surface)}

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;align-items:center}
  .lg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
  .sw{width:12px;height:12px;border:1px solid var(--hair)}

  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0 0}
  .sec{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
  .sec + .sec{margin-top:20px}
  .btn{font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;cursor:pointer;background:var(--surface);border:1px solid var(--rule);color:var(--ink)}
  .btn:hover{background:var(--ink);color:var(--sheet)}
  .btn:focus-visible{outline:2px solid var(--red);outline-offset:1px}
  .btn.dim{border-color:var(--hair);color:var(--muted)}
  .btn.sm{padding:5px 8px;font-size:11px}
  .btn.danger:hover{background:var(--red);border-color:var(--red);color:#fff}
  .inp{font-family:var(--body);font-size:13px;padding:7px 8px;width:100%;border:1px solid var(--hair);background:var(--surface);color:var(--ink)}
  .inp:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--rule)}
  .inp.num{font-family:var(--mono);text-align:right}
  .row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .lab{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tot{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tot.bad{color:var(--red);font-weight:600}
  select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}

  /* area cards (setup accordion) */
  .acard{border:1px solid var(--rule);background:var(--surface);margin-bottom:10px}
  .acard-h{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;background:var(--sheet)}
  .acard-h .nm{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acard-h .car{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .acard-b{padding:11px;border-top:1px solid var(--hair)}
  .acard-b[hidden]{display:none}

  table.plain{width:100%;border-collapse:collapse;font-size:12px}
  table.plain th{font-family:var(--disp);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:5px 6px;border-bottom:1px solid var(--rule)}
  table.plain th:first-child{text-align:left}
  table.plain td{padding:5px 6px;border-bottom:1px solid var(--hair);text-align:right;font-family:var(--mono)}
  table.plain td:first-child{text-align:left;font-family:var(--disp);font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:500}
  table.plain tr.sum td{border-top:1px solid var(--rule);border-bottom:none;font-weight:700;background:var(--sheet)}
  .billarea{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
  .billarea:first-child{margin-top:0}
  .billarea .k{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}

  .blk{border-left:3px solid var(--red);background:var(--surface);padding:8px 10px;margin-bottom:7px;border-bottom:1px solid var(--hair)}
  .blk h4{font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin:0 0 2px}
  .blk p{margin:0;font-size:12px;line-height:1.45}
  .blk .who{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
  .empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--hair)}

  .scrim{position:fixed;inset:0;background:rgba(16,22,30,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
  .modal{background:var(--sheet);border:1px solid var(--rule);width:100%;max-width:400px;max-height:90vh;overflow:auto}
  .modal-h{padding:10px 12px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .modal-h b{font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .modal-h span{font-family:var(--disp);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}
  .modal-b{padding:12px}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .sbtn{padding:12px 6px;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  .sbtn[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
  .sbtn[data-s="done"][aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
  .sbtn[data-s="blocked"][aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
  .sbtn[data-s="ip"][aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--ink)}
  .sbtn:focus-visible{outline:2px solid var(--red);outline-offset:1px}
  .chips{display:flex;gap:4px;margin:6px 0 10px}
  .chip{flex:1;padding:6px 0;border:1px solid var(--hair);background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:11px}
  .chip:hover{border-color:var(--rule)}
  input[type=range]{width:100%;accent-color:var(--red)}
  .modal-f{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--rule)}
  .modal-f .btn{flex:1}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 16px;z-index:60;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}

  .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--rule);background:var(--surface)}
  .foot small{font-family:var(--mono);font-size:10px;color:var(--muted)}

  @media (max-width:560px){.fgrid{grid-template-columns:1fr}.tb-f{flex:1 1 50%}.tb-pct b{font-size:27px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="tbx">
  <div class="pbar">
    <select class="psel" id="projsel" aria-label="Select project"></select>
    <button class="btn dim" id="projbtn">Projects</button>
  </div>
  <div class="tb-head">
    <div class="tb-fields" id="tbf"></div>
    <div class="tb-bar">
      <div class="tb-meter"><div class="tb-fill" id="fill"></div><div class="tb-meter-lab">Installed to date</div></div>
      <div class="tb-pct"><b id="bigpct">0</b><i>%</i></div>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="grid">Progress</button>
    <button class="tab" role="tab" data-v="curve">Curve</button>
    <button class="tab" role="tab" data-v="bill">Billing</button>
    <button class="tab" role="tab" data-v="blocked">Blockers</button>
    <button class="tab" role="tab" data-v="setup">Setup</button>
  </div>

  <div class="pane" id="pane"></div>

  <div class="foot">
    <small id="stamp">Loading…</small>
    <div style="display:flex;gap:6px">
      <button class="btn" id="send">Send update</button>
      <button class="btn dim" id="who">Sign in</button>
      <button class="btn dim" id="refresh">Refresh</button>
    </div>
  </div>
</div>
<div id="layer"></div>

<script>
(function(){
  const OLD='sprinkler-tracker-v2';              // legacy single-project key (for migration)
  const PIDX='proj-index-v1', TIDX='tpl-index-v1', ME='tracker-identity-v1', ACTIVE='active-project-v1', FMODE='field-mode-v1';
  const PKEY=id=>'proj:'+id, TKEY=id=>'tpl:'+id;
  const S={NS:'ns',IP:'ip',DONE:'done',BLOCKED:'blocked'};
  const SNAME={ns:'Not started',ip:'In progress',done:'Complete',blocked:'Blocked'};

  // phase templates: [name, weight, cycle, span, mode, lag]
  // cycle = working days between levels · span = working days the work actually takes on one level
  // mode: 'area' starts with the area · 'follow' trails the previous phase by lag · 'own' has its own start date
  const TPL={
    woodframe:{label:'Woodframe',rowLabel:'Floors',rowNoun:'floor',dir:'desc',phases:[
      ['Rough-in',45,5,5,'area',0],['Inspection',5,5,1,'follow',0],['Drops',20,10,1,'own',0],['Finishing',30,10,1,'own',0]]},
    tower:    {label:'Tower',    rowLabel:'Floors',rowNoun:'floor',dir:'desc',phases:[
      ['Rough-in',55,5,5,'area',0],['Inspection',10,5,1,'follow',0],['Finishing',35,10,1,'own',0]]},
    parkade:  {label:'Parkade',  rowLabel:'Parkade levels',rowNoun:'level',dir:'asc',phases:[
      ['Mains',35,5,5,'area',0],['Branch lines',35,5,5,'follow',0],['Inspection',10,5,1,'follow',0],['Dry test',20,5,1,'follow',0]]},
    valveroom:{label:'Valve room',rowLabel:'Valve rooms',rowNoun:'valve room',dir:'asc',phases:[
      ['Valve Header',20,1,5,'area',0],['Compressor',15,1,2,'follow',0],['Fire Pump',30,1,5,'follow',0],['Copper lines',15,1,3,'follow',0],['Commissioning',20,1,3,'follow',2]]}
  };
  const uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  function makePhases(kind){
    return TPL[kind].phases.map(([name,weight,cycle,span,mode,lag])=>({id:uid('p'),name,weight,cycle,span,mode,lag,start:''}));
  }

  function seedArea(kind,name,rows,weight){
    return {id:uid('a'),name,kind,weight:weight==null?10:weight,totalHours:0,start:'',seq:defSeq(kind),
      pace:defPace(kind),crew:2,spreadDays:0,phases:makePhases(kind),rows:rows.map(n=>({id:uid('r'),name:n,heads:0}))};
  }
  const defSeq=k=>(k==='woodframe'||k==='tower')?'up':'down';
  const defPace=k=>(k==='woodframe'||k==='tower')?'cycle':'spread';
  const seqPos=(area,ri)=>area.seq==='up'?(area.rows.length-1-ri):ri;
  function seed(){
    return {
      project:{name:'Untitled project',number:'—',gc:'—',rev:'—'},
      weightMode:'manual', hoursPerHead:1.5,
      schedule:{daysPerWeek:5,hoursPerDay:8,weekEnds:5,holidays:'',baselineOn:null},
      areas:[
        seedArea('tower','Building A',['L06','L05','L04','L03','L02','L01'],60),
        seedArea('parkade','Parkade',['P1','P2','P3'],25),
        seedArea('valveroom','Valve Room',['Valve Room'],15)
      ],
      cells:{}, burned:[], updated:null, by:null
    };
  }

  let doc=seed(), me='', view='grid', activeArea=null, setupOpen=null, busy=false, dirtyTimer=null;
  let projIndex=[], tplIndex=[], activeId=null, fieldMode=false;

  const $=s=>document.querySelector(s);
  const pane=$('#pane'), layer=$('#layer');
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ck=(a,r,p)=>a+':'+r+':'+p;
  const cell=(a,r,p)=>doc.cells[ck(a,r,p)]||{status:S.NS,pct:0,note:'',by:'',at:''};
  const r1=n=>Math.round(n*10)/10;
  const areaById=id=>doc.areas.find(a=>a.id===id);

  function pctOf(c){ return c.status===S.DONE?100 : c.status===S.IP?Math.max(0,Math.min(100,c.pct||0)) : 0; }
  const labour=()=>doc.weightMode==='labour';

  // hours of installed labour represented by a level / area.
  // In labour mode this is real: heads x hours/head. In manual mode nobody enters
  // heads, so we synthesise a size from the area's manual weight spread evenly across
  // its rows — enough for the schedule/curve to have something to distribute.
  function rowHours(area,row){
    if(labour()) return (+row.heads||0)*(+doc.hoursPerHead||0);
    return (+area.weight||0)/Math.max(1,area.rows.length);
  }
  function areaHours(area){
    if(labour()){
      if(area.kind==='valveroom') return +area.totalHours||0;
      return area.rows.reduce((s,r)=>s+rowHours(area,r),0);
    }
    return +area.weight||0;   // manual: the area's own weight is its size
  }
  // Informational hours, computed the same way in either mode from whatever labour
  // figures the user has entered. Independent of weightMode — used for the hours readout.
  function infoAreaHours(area){
    if(area.kind==='valveroom') return +area.totalHours||0;
    const hph=+doc.hoursPerHead||0;
    return area.rows.reduce((s,r)=>s+(+r.heads||0)*hph,0);
  }
  function infoProjectHours(){ return doc.areas.reduce((s,a)=>s+infoAreaHours(a),0); }
  // weight of a level within its area (drives area %)
  function rowWeight(area,row){
    if(labour() && area.kind!=='valveroom'){
      const anyHeads=area.rows.some(r=>(+r.heads||0)>0);
      return anyHeads ? (+row.heads||0) : 1;   // fall back to equal if no heads entered yet
    }
    return 1;                                   // manual mode & valve rooms: equal
  }
  // weight of an area within the project (drives project total)
  function projWeight(area){ return labour() ? areaHours(area) : (+area.weight||0); }

  function rowPct(area,row){
    const tw=area.phases.reduce((s,p)=>s+(+p.weight||0),0);
    if(!tw) return 0;
    return area.phases.reduce((s,p)=>s+(+p.weight||0)*pctOf(cell(area.id,row.id,p.id)),0)/tw;
  }
  function areaPct(area){
    let w=0,sum=0; area.rows.forEach(r=>{ const rw=rowWeight(area,r); w+=rw; sum+=rw*rowPct(area,r); });
    return w? sum/w : 0;
  }
  function phasePct(area,p){
    let w=0,sum=0; area.rows.forEach(r=>{ const rw=rowWeight(area,r); w+=rw; sum+=rw*pctOf(cell(area.id,r.id,p.id)); });
    return w? sum/w : 0;
  }
  function totalWeight(){ return doc.areas.reduce((s,a)=>s+(a.rows.length&&projWeight(a)>0?projWeight(a):0),0); }
  function projectPct(){
    const w=totalWeight(); if(!w) return 0;
    let sum=0; doc.areas.forEach(a=>{ if(a.rows.length&&projWeight(a)>0) sum+=areaPct(a)*projWeight(a); });
    return sum/w;
  }

  // ---------- working-day calendar ----------
  const DAY=86400000;
  function parseD(s){ if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3]); }
  function fmtD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function holidaySet(){
    const out={}; (doc.schedule&&doc.schedule.holidays||'').split(/[\s,;]+/).forEach(t=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(t)) out[t]=1; }); return out;
  }
  function isWork(d,hol,dpw){
    const g=d.getDay();
    if(g===0) return false;                 // Sunday never
    if(g===6 && dpw<6) return false;        // Saturday only on 6-day weeks
    return !hol[fmtD(d)];
  }
  // advance n working days from d (n=0 returns the first working day on or after d)
  function addWork(d,n,hol,dpw){
    let c=new Date(d.getTime());
    while(!isWork(c,hol,dpw)) c=new Date(c.getTime()+DAY);
    let left=n;
    while(left>0){ c=new Date(c.getTime()+DAY); while(!isWork(c,hol,dpw)) c=new Date(c.getTime()+DAY); left--; }
    return c;
  }

  // start date of a phase on a given row index
  function phaseStart(area,pi,ri,hol,dpw,cache){
    const key=pi+'|'+ri; if(cache[key]) return cache[key];
    const p=area.phases[pi]; let base; const sp=seqPos(area,ri);
    if(pi===0 || p.mode==='area'){
      const s=parseD(area.start); if(!s) return null;
      base=addWork(s, sp*Math.max(0,+p.cycle||0), hol, dpw);
    } else if(p.mode==='own'){
      const own=parseD(p.start);
      if(own){ base=addWork(own, sp*Math.max(0,+p.cycle||0), hol, dpw); }
      else {
        // own-start selected but no date entered yet: trail the previous phase instead of
        // collapsing onto the area start (which would spike the curve on day one)
        const prev=area.phases[pi-1], pd=phaseStart(area,pi-1,ri,hol,dpw,cache); if(!pd) return null;
        base=addWork(pd, Math.max(0,+prev.span||1)+Math.max(0,+p.lag||0), hol, dpw);
      }
    } else {
      const prev=area.phases[pi-1], pd=phaseStart(area,pi-1,ri,hol,dpw,cache); if(!pd) return null;
      base=addWork(pd, Math.max(0,+prev.span||1)+Math.max(0,+p.lag||0), hol, dpw);
    }
    cache[key]=base; return base;
  }

  // hours attributable to one (row, phase) pair
  function cellHours(area,row,p){
    const tw=area.phases.reduce((s,x)=>s+(+x.weight||0),0); if(!tw) return 0;
    const base = area.kind==='valveroom'
      ? (areaHours(area)/Math.max(1,area.rows.length))
      : rowHours(area,row);
    return base*(+p.weight||0)/tw;
  }

  // duration in working days for a continuous (spread) area
  function spreadDays(area){
    if((+area.spreadDays||0)>0) return Math.round(+area.spreadDays);
    const daily=Math.max(1,(+area.crew||1))*Math.max(1,(+(doc.schedule&&doc.schedule.hoursPerDay)||8));
    return Math.max(1,Math.ceil(areaHours(area)/daily));
  }
  function phaseHoursTotal(area,p){ return area.rows.reduce((s,r)=>s+cellHours(area,r,p),0); }

  // planned hours laid onto dates -> [{t:ms, h:hours}]
  function plannedEvents(){
    const hol=holidaySet(), dpw=(doc.schedule&&+doc.schedule.daysPerWeek)||5, out=[];
    doc.areas.forEach(area=>{
      const st0=parseD(area.start); if(!st0) return;

      if(area.pace==='spread'){
        const D=spreadDays(area), tw=area.phases.reduce((s,x)=>s+(+x.weight||0),0); if(!tw) return;
        let cursor=0;
        area.phases.forEach((p,pi)=>{
          const share=(+p.weight||0)/tw;
          const pd=(pi===area.phases.length-1)?Math.max(1,D-cursor):Math.max(1,Math.round(D*share));
          const h=phaseHoursTotal(area,p);
          if(h>0){ for(let k=0;k<pd;k++) out.push({t:addWork(st0,cursor+k,hol,dpw).getTime(),h:h/pd}); }
          cursor+=pd;
        });
        return;
      }

      const cache={};
      area.phases.forEach((p,pi)=>{
        area.rows.forEach((row,ri)=>{
          const h=cellHours(area,row,p); if(h<=0) return;
          const st=phaseStart(area,pi,ri,hol,dpw,cache); if(!st) return;
          const span=Math.max(1,Math.round(+p.span||1)), per=h/span;
          for(let k=0;k<span;k++) out.push({t:addWork(st,k,hol,dpw).getTime(),h:per});
        });
      });
    });
    return out.sort((a,b)=>a.t-b.t);
  }

  // Friday (or configured day) of the ISO week containing d
  function weekEnding(d,wd){
    const g=d.getDay()||7;
    const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-(g-1));
    return new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+(Math.max(1,Math.min(7,wd||5))-1));
  }
  const thisWeekEnd=()=>fmtD(weekEnding(new Date(),(doc.schedule&&doc.schedule.weekEnds)||5));

  // actual earned hours — by the week the work was done, falling back to when it was logged
  function actualEvents(){
    const out=[];
    doc.areas.forEach(area=>area.rows.forEach(row=>area.phases.forEach(p=>{
      const c=cell(area.id,row.id,p.id);
      const pc=pctOf(c); if(pc<=0) return;
      let d=parseD(c.on); if(!d){ if(!c.at) return; const x=new Date(c.at); if(isNaN(x)) return; d=new Date(x.getFullYear(),x.getMonth(),x.getDate()); }
      out.push({t:d.getTime(),h:cellHours(area,row,p)*pc/100});
    })));
    return out.sort((a,b)=>a.t-b.t);
  }
  // burned hours from the weekly timesheet log
  function burnedEvents(){
    return (doc.burned||[]).map(b=>{ const d=parseD(b.week); return d?{t:d.getTime(),h:+b.hours||0}:null; })
      .filter(Boolean).sort((a,b)=>a.t-b.t);
  }
  const burnedTotal=()=>(doc.burned||[]).reduce((s,b)=>s+(+b.hours||0),0);

  function totalPlannedHours(){ return doc.areas.reduce((s,a)=>s+(parseD(a.start)?areaHours(a):0),0); }

  // weekly cumulative % series
  function curveSeries(){
    const pe=plannedEvents(); if(!pe.length) return null;
    const ae=actualEvents(), be=burnedEvents();
    const total=pe.reduce((s,e)=>s+e.h,0); if(total<=0) return null;
    let lo=pe[0].t, hi=pe[pe.length-1].t;
    [ae,be].forEach(arr=>{ if(arr.length){ lo=Math.min(lo,arr[0].t); hi=Math.max(hi,arr[arr.length-1].t); } });
    const now=Date.now();
    // always span today, so a project that hasn't started yet reads 0% rather than
    // clamping onto the first planned week
    lo=Math.min(lo,now); hi=Math.max(hi,now);
    const start=new Date(lo); start.setDate(start.getDate()-start.getDay()+1);
    const weeks=[]; for(let t=start.getTime(); t<=hi+7*DAY; t+=7*DAY) weeks.push(t);
    if(weeks.length<2) weeks.push(weeks[0]+7*DAY);
    const bucket=(ev)=>{ const out=weeks.map(()=>0);
      ev.forEach(e=>{ let i=Math.floor((e.t-weeks[0])/(7*DAY)); if(i<0)i=0; if(i>=weeks.length)i=weeks.length-1; out[i]+=e.h; });
      let run=0; return out.map(v=>{ run+=v; return run/total*100; }); };
    // exact cumulative % as of end-of-today, summed from raw events rather than read off
    // the weekly buckets — so a job that starts tomorrow reads 0 now, not a week ahead
    const endToday=new Date(now); endToday.setHours(23,59,59,999);
    const asOf=(ev)=>{ let s=0; ev.forEach(e=>{ if(e.t<=endToday.getTime()) s+=e.h; }); return s/total*100; };
    return {weeks,planned:bucket(pe),actual:ae.length?bucket(ae):null,burned:be.length?bucket(be):null,
      plannedNow:asOf(pe), actualNow:ae.length?asOf(ae):null, burnedNow:be.length?asOf(be):null,
      total,now,firstWork:pe[0].t,lastWork:pe[pe.length-1].t,hasActual:ae.length>0,hasBurned:be.length>0};
  }

  function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }

  // ---------- storage: low level ----------
  // Local-first storage. Uses the device's own storage when available (running the file
  // locally); falls back to Claude's shared storage if opened as an artifact.
  const LOCAL=(function(){ try{ const k='__spk_probe'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }catch(e){ return false; } })();
  const LK=k=>'spk:'+k;
  async function sget(k,shared){
    if(LOCAL){ try{ const v=window.localStorage.getItem(LK(k)); return v?JSON.parse(v):null; }catch(e){ return null; } }
    try{ const r=await window.storage.get(k,shared); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; }
  }
  async function sset(k,v,shared){
    if(LOCAL){ try{ window.localStorage.setItem(LK(k),JSON.stringify(v)); return; }catch(e){ toast('Device storage full'); return; } }
    try{ const r=await window.storage.set(k,JSON.stringify(v),shared); if(!r) toast('Save failed'); }catch(e){ toast('Save failed — check connection'); }
  }
  async function sdel(k,shared){
    if(LOCAL){ try{ window.localStorage.removeItem(LK(k)); }catch(e){} return; }
    try{ await window.storage.delete(k,shared); }catch(e){}
  }

  // ---------- file export / import ----------
  function download(name,text,mime){
    try{
      const blob=new Blob([text],{type:mime||'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=name;
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },200);
      toast('Saved '+name);
    }catch(e){ toast('Download blocked'); }
  }
  const safeName=s=>String(s||'project').replace(/[^A-Za-z0-9._-]+/g,'-').slice(0,40);
  const stamp=()=>fmtD(new Date());

  function exportProject(){
    return JSON.stringify({kind:'sprinkler-tracker-project',version:2,exported:new Date().toISOString(),by:me||'',doc},null,1);
  }
  async function exportAll(){
    const projs=[]; for(const p of projIndex){ const d=await sget(PKEY(p.id),true); if(d) projs.push({id:p.id,doc:d}); }
    const tpls=[]; for(const t of tplIndex){ const d=await sget(TKEY(t.id),true); if(d) tpls.push({id:t.id,name:t.name,tpl:d}); }
    return JSON.stringify({kind:'sprinkler-tracker-backup',version:2,exported:new Date().toISOString(),by:me||'',projIndex,tplIndex,projs,tpls},null,1);
  }
  // Take THEIR structure and settings, keep MY progress. Used when the PM changes
  // the setup and pushes a fresh file down to a foreman who has unsent work.
  function adoptSetup(local,incoming){
    const out=JSON.parse(JSON.stringify(incoming));
    out.cells={};
    Object.keys(local.cells||{}).forEach(k=>{ out.cells[k]=local.cells[k]; });
    const at=x=>x&&x.at?new Date(x.at).getTime():0;
    let taken=0;
    Object.keys(incoming.cells||{}).forEach(k=>{
      const a=out.cells[k], b=incoming.cells[k];
      if(!a||at(b)>at(a)){ out.cells[k]=b; taken++; }
    });
    // drop progress whose level or phase no longer exists in the new structure
    const valid={};
    out.areas.forEach(a=>a.rows.forEach(r=>a.phases.forEach(p=>{ valid[ck(a.id,r.id,p.id)]=1; })));
    let dropped=0;
    Object.keys(out.cells).forEach(k=>{ if(!valid[k]){ delete out.cells[k]; dropped++; } });
    const byWeek={}; (local.burned||[]).forEach(x=>byWeek[x.week]=x);
    (incoming.burned||[]).forEach(x=>{ byWeek[x.week]=x; });
    out.burned=Object.keys(byWeek).map(w=>byWeek[w]);
    return {doc:out,taken,dropped,kept:Object.keys(out.cells).length};
  }

  // structure stays local; progress merges newest-wins per cell
  function mergeDoc(local,incoming){
    const out=JSON.parse(JSON.stringify(local));
    let cells=0,weeks=0;
    Object.keys(incoming.cells||{}).forEach(k=>{
      const a=out.cells[k], b=incoming.cells[k];
      const at=x=>x&&x.at?new Date(x.at).getTime():0;
      if(!a || at(b)>at(a)){ out.cells[k]=b; cells++; }
    });
    const byWeek={}; (out.burned||[]).forEach(x=>byWeek[x.week]=x);
    (incoming.burned||[]).forEach(x=>{ if(!byWeek[x.week]) weeks++; byWeek[x.week]=x; });
    out.burned=Object.keys(byWeek).map(w=>byWeek[w]);
    return {doc:out,cells,weeks};
  }

  const metaOf=d=>({id:activeId,name:d.project.name,number:d.project.number,gc:d.project.gc});
  function upsertIndexEntry(){
    const m={id:activeId,name:doc.project.name,number:doc.project.number,gc:doc.project.gc};
    const i=projIndex.findIndex(p=>p.id===activeId);
    if(i<0) projIndex.push(m); else projIndex[i]=m;
  }
  function cloneAreasFresh(areas){
    return areas.map(a=>({id:uid('a'),name:a.name,kind:a.kind,weight:a.weight,totalHours:a.totalHours||0,start:'',seq:a.seq||defSeq(a.kind),pace:a.pace||defPace(a.kind),crew:a.crew||2,spreadDays:a.spreadDays||0,
      phases:a.phases.map(p=>({id:uid('p'),name:p.name,weight:p.weight,cycle:p.cycle,span:p.span,mode:p.mode,lag:p.lag,start:''})),
      rows:a.rows.map(r=>({id:uid('r'),name:r.name,heads:r.heads||0}))}));
  }
  function normalize(d){
    d={...seed(),...d};
    if(d.weightMode==null) d.weightMode='manual';
    if(d.hoursPerHead==null) d.hoursPerHead=1.5;
    if(d.schedule==null) d.schedule={daysPerWeek:5,holidays:'',baselineOn:null};
    if(d.schedule.daysPerWeek==null) d.schedule.daysPerWeek=5;
    if(d.schedule.holidays==null) d.schedule.holidays=''; if(d.schedule.hoursPerDay==null) d.schedule.hoursPerDay=8; if(d.schedule.weekEnds==null) d.schedule.weekEnds=5; if(!Array.isArray(d.burned)) d.burned=[];
    // completed work can't have a future date — earlier builds defaulted the date to the end
    // of the week, which pushed completions ahead of today. Snap any future date back to today.
    (function(){ const todayS=fmtD(new Date()); const t=new Date(); t.setHours(23,59,59,999);
      Object.keys(d.cells||{}).forEach(k=>{ const c=d.cells[k]; if(c&&c.on){ const dd=parseD(c.on); if(dd&&dd.getTime()>t.getTime()) c.on=todayS; } }); })();
    d.areas.forEach(a=>{
      if(a.weight==null) a.weight=Math.max(1,a.rows.length);
      if(a.totalHours==null) a.totalHours=0;
      if(a.start==null) a.start=''; if(a.seq==null) a.seq=defSeq(a.kind); if(a.pace==null) a.pace=defPace(a.kind); if(a.crew==null) a.crew=2; if(a.spreadDays==null) a.spreadDays=0;
      const def=TPL[a.kind]?TPL[a.kind].phases:[];
      a.phases.forEach((p,i)=>{

        if(p.cycle==null) p.cycle=dd[2]!=null?dd[2]:5;
        if(p.span==null) p.span=dd[3]!=null?dd[3]:1;
        if(p.mode==null) p.mode=i===0?'area':(dd[4]||'follow');
        if(p.lag==null) p.lag=dd[5]!=null?dd[5]:0;
        if(p.start==null) p.start='';
      });
      a.rows.forEach(r=>{ if(r.heads==null) r.heads=0; });
    });
    return d;
  }

  // ---------- storage: orchestration ----------
  async function boot(){
    const idn=await sget(ME,false); if(idn) me=idn.name||''; const fm=await sget(FMODE,false); fieldMode=!!(fm&&fm.on);
    activeId=await sget(ACTIVE,false);
    projIndex=await sget(PIDX,true)||[];
    tplIndex=await sget(TIDX,true)||[];

    if(!projIndex.length){
      // migrate a legacy single project, or start fresh
      const old=await sget(OLD,true);
      const d= old? normalize(old) : seed();
      activeId=uid('proj');
      doc=d; upsertIndexEntry();
      await sset(PIDX,projIndex,true); await sset(PKEY(activeId),doc,true); await sset(ACTIVE,activeId,false);
    }
    if(!activeId || !projIndex.some(p=>p.id===activeId)){ activeId=projIndex[0].id; await sset(ACTIVE,activeId,false); }
    doc=normalize(await sget(PKEY(activeId),true)||seed());

  }

  async function saveTemplate(name){

  // ---------- curve ----------
  function viewCurve(){
    const noStart=doc.areas.filter(a=>!parseD(a.start));
    const s=curveSeries();
    if(!s) return `<div class="empty">No baseline yet. Set a <b>start date</b> for at least one area in Setup — the curve is built from your hours and that schedule.</div>`;
    const W=680,H=290,L=42,R=12,T=14,B=34, iw=W-L-R, ih=H-T-B;
    const n=s.weeks.length;
    // time-based x: t0 = start of first week, t1 = end of last week. Weekly cumulative
    // values are plotted at each week's END, and the line is anchored at 0% at t0, so it
    // rises from zero instead of launching off the first bucket.
    const t0=s.weeks[0], t1=s.weeks[n-1]+7*DAY, span=Math.max(1,t1-t0);
    const xt=t=>L+(t-t0)/span*iw, y=v=>T+ih-(v/100*ih);
    const pts=arr=>{ const p=[[t0,0]]; arr.forEach((v,i)=>p.push([s.weeks[i]+7*DAY,v])); return p; };
    // earned/burned are actuals — they should stop at today, not run flat into the future
    const ptsToNow=(arr,endVal)=>{ const p=[[t0,0]]; arr.forEach((v,i)=>{ const we=s.weeks[i]+7*DAY; if(we<=s.now) p.push([we,v]); }); p.push([Math.min(Math.max(s.now,t0),t1),endVal]); return p; };
    const path=arr=>pts(arr).map((pt,i)=>(i?'L':'M')+r1(xt(pt[0]))+' '+r1(y(pt[1]))).join(' ');
    const pathNow=(arr,endVal)=>ptsToNow(arr,endVal).map((pt,i)=>(i?'L':'M')+r1(xt(pt[0]))+' '+r1(y(pt[1]))).join(' ');
    const nowX=r1(xt(Math.min(Math.max(s.now,t0),t1)));
    const nowLate=(s.now-t0)/span>0.75;
    const pNow=s.plannedNow, aNow=s.hasActual?s.actualNow:null, bNow=s.hasBurned?s.burnedNow:null;
    const schV=aNow==null?null:aNow-pNow;
    const prodV=(aNow==null||bNow==null)?null:aNow-bNow;
    const col=v=>v==null?'inherit':(v<0?'var(--red)':'var(--green)');
    let g='';
    for(let v=0;v<=100;v+=25) g+=`<line x1="${L}" y1="${r1(y(v))}" x2="${W-R}" y2="${r1(y(v))}" stroke="var(--hair)" stroke-width="1"/><text x="${L-6}" y="${r1(y(v))+4}" text-anchor="end" class="axl">${v}%</text>`;
    const step=Math.max(1,Math.ceil(n/8));
    for(let i=0;i<n;i+=step){ const d=new Date(s.weeks[i]);
      g+=`<text x="${r1(xt(s.weeks[i]))}" y="${H-12}" text-anchor="middle" class="axl">${d.toLocaleDateString([], {month:'short',day:'numeric'})}</text>`; }
    const areaPath=`M${r1(xt(t0))} ${r1(y(0))} `+pts(s.planned).map(pt=>'L'+r1(xt(pt[0]))+' '+r1(y(pt[1]))).join(' ')+` L${r1(xt(t1))} ${r1(y(0))} Z`;

    let h=`<div class="sec" style="margin-top:0">Planned vs actual${labour()?' — '+r1(s.total)+' budgeted hours':''}</div>
    <div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative progress curves: planned baseline, earned actual, and burned timesheet hours">
      ${g}
      <path d="${areaPath}" fill="var(--fillplan)"/>
      <path d="${path(s.planned)}" fill="none" stroke="var(--plan)" stroke-width="2" stroke-linejoin="round"/>
      ${s.hasBurned?`<path d="${pathNow(s.burned,s.burnedNow)}" fill="none" stroke="var(--burn)" stroke-width="2" stroke-dasharray="2 3" stroke-linejoin="round"/>`:''}
      ${s.hasActual?`<path d="${pathNow(s.actual,s.actualNow)}" fill="none" stroke="var(--act)" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>`:''}
      <line x1="${nowX}" y1="${T}" x2="${nowX}" y2="${T+ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${nowX+(nowLate?-4:4)}" y="${T+10}" class="axl" text-anchor="${nowLate?'end':'start'}">today</text>
      <line x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}" stroke="var(--rule)" stroke-width="1"/>
    </svg></div>
    <div class="legend" style="margin-top:8px">
      <span class="lg"><span class="sw" style="background:var(--plan);border-color:var(--plan)"></span>Planned</span>
      <span class="lg"><span class="sw" style="background:var(--act);border-color:var(--act)"></span>Earned${s.hasActual?'':' — none logged'}</span>
      <span class="lg"><span class="sw" style="background:var(--burn);border-color:var(--burn)"></span>Burned${s.hasBurned?'':' — none entered'}</span>
    </div>`;

    h+=`<div class="sec">Position today</div><table class="plain"><tbody>
      <tr><td>Planned</td><td>${r1(pNow)}%</td>${labour()?`<td>${r1(pNow/100*s.total)} h</td>`:''}</tr>
      <tr><td>Earned</td><td>${aNow==null?'—':r1(aNow)+'%'}</td>${labour()?`<td>${aNow==null?'—':r1(aNow/100*s.total)+' h'}</td>`:''}</tr>
      <tr><td>Burned</td><td>${bNow==null?'—':r1(bNow)+'%'}</td>${labour()?`<td>${bNow==null?'—':r1(bNow/100*s.total)+' h'}</td>`:''}</tr>
      <tr class="sum"><td>Schedule</td><td style="color:${col(schV)}">${schV==null?'—':(schV>0?'+':'')+r1(schV)+'%'}</td>${labour()?`<td style="color:${col(schV)}">${schV==null?'—':(schV>0?'+':'')+r1(schV/100*s.total)+' h'}</td>`:''}</tr>
      <tr class="sum"><td>Productivity</td><td style="color:${col(prodV)}">${prodV==null?'—':(prodV>0?'+':'')+r1(prodV)+'%'}</td>${labour()?`<td style="color:${col(prodV)}">${prodV==null?'—':(prodV>0?'+':'')+r1(prodV/100*s.total)+' h'}</td>`:''}</tr>
    </tbody></table>
    ${s.now < s.firstWork ? `<p class="hint"><b>Not started yet.</b> First planned work is ${new Date(s.firstWork).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})}, so planned, earned and burned are all zero until then. Variance only becomes meaningful once the job is underway.</p>` : ''}
    <p class="hint"><b>Schedule</b> is earned minus planned — are you keeping up. <b>Productivity</b> is earned minus burned — are the hours you spent producing the work you estimated. Negative is behind or over.</p>
    <div class="row" style="margin-top:12px"><button class="btn" id="cpcurve">Copy curve data</button></div>`;

    h+=`<div class="sec">Weekly burned hours</div>
    <div class="row" style="flex-wrap:wrap">
      <div style="flex:0 0 150px"><label class="mini">Week ending</label><input class="inp" type="date" id="bw" value="${esc(thisWeekEnd())}"></div>
      <div style="flex:0 0 100px"><label class="mini">Hours</label><input class="inp num" id="bh" inputmode="decimal" placeholder="0"></div>
      <div style="flex:0 0 auto;align-self:flex-end"><button class="btn" id="baddb">Add</button></div>
    </div>`;
    const bl=(doc.burned||[]).slice().sort((x,z)=>(x.week<z.week?1:-1));
    if(bl.length){
      h+=`<div class="mlist" style="margin-top:8px">${bl.map(b=>`<div class="mrow">
        <span class="mname">${esc(b.week)}</span>
        <span class="msub">${r1(+b.hours||0)} h</span>
        <button class="btn dim danger sm" data-bdel="${esc(b.id)}" aria-label="Delete entry">×</button></div>`).join('')}</div>
        <p class="hint">Total burned to date: <b>${r1(burnedTotal())} h</b> of ${r1(s.total)} budgeted.</p>`;
    } else {
      h+=`<p class="hint">Nothing entered yet. Add your weekly timesheet total each week and the burned line appears on the chart.</p>`;
    }

    if(noStart.length) h+=`<p class="hint"><b>Not in the baseline:</b> ${noStart.map(a=>esc(a.name)).join(', ')} — no start date set, so those hours are excluded from the curve and totals above.</p>`;
    return h;
  }

          ` : `

                ?`<div style="flex:0 0 150px"><label class="mini">Start (first level)${p.start?'':' — set me'}</label><input class="inp" type="date" data-ps="${a.id}|${i}" value="${esc(p.start||'')}" style="${p.start?'':'outline:2px solid var(--amber)'}"></div>`
                :(i>0?`<div style="flex:0 0 74px"><label class="mini">Lag days</label><input class="inp num" data-pl="${a.id}|${i}" value="${esc(p.lag)}" inputmode="numeric"></div>`:'')}

          <p class="hint"><b>Timing:</b> “Follows previous” runs right after the phase above. “Own start date” is for work that trails far behind — like finishing, which waits on ceilings and paint. <b>Cycle</b> is how often you move to the next level; <b>Work days</b> is how long the work takes on one level.</p>
          `}
          <div class="row" style="margin-top:10px"><button class="btn danger sm" data-ad="${a.id}">Delete this area</button></div>
        </div>`;
      }
      return `<div class="acard"><div class="acard-h" data-atoggle="${a.id}">
          <span class="nm">${esc(a.name)}</span>
          <span class="kindtag">${esc(t.label)}</span>
          <span class="kindtag wtag" data-wtag="${a.id}">${labour()?r1(areaHours(a))+' h':'W '+esc(a.weight)}</span>
          <span class="tot">${Math.round(areaPct(a))}%</span>
          <span class="car">${open?'▾':'▸'}</span>
        </div>${b}</div>`;
    }).join('');
  }

  function render(){
    paintHead();
    pane.innerHTML = view==='grid'?viewGrid() : view==='curve'?viewCurve() : view==='bill'?viewBill() : view==='blocked'?viewBlocked() : (fieldMode?viewGrid():viewSetup());

  }

  // ---------- cell modal ----------
  function openCell(aid,rid,pid){
    const a=areaById(aid); if(!a) return;
    const r=a.rows.find(x=>x.id===rid), p=a.phases.find(x=>x.id===pid); if(!r||!p) return;
    const c=cell(aid,rid,pid);
    let st=c.status, pc=c.status===S.IP?(c.pct||50):(c.status===S.DONE?100:0);
    layer.innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(r.name)} ${esc(p.name)}">
      <div class="modal-h"><b>${esc(r.name)}</b><span>${esc(a.name)}<br>${esc(p.name)}</span></div>
      <div class="modal-b">
        <div class="stat">
          <button class="sbtn" data-s="ns">Not started</button>
          <button class="sbtn" data-s="ip">In progress</button>
          <button class="sbtn" data-s="done">Complete</button>
          <button class="sbtn" data-s="blocked">Blocked</button>
        </div>
        <div id="pctwrap" hidden>
          <label class="lab" for="rng">Percent complete — <span id="pv" class="tot">${pc}%</span></label>
          <input type="range" id="rng" min="0" max="100" step="5" value="${pc}">
          <div class="chips">${[10,25,50,75,90].map(v=>`<button class="chip" data-c="${v}">${v}</button>`).join('')}</div>
        </div>
        <label class="lab" id="ntl" for="nt">Note</label>
        <input class="inp" id="nt" value="${esc(c.note||'')}" placeholder="Optional">
        <label class="lab" for="onw" style="margin-top:10px">Date completed</label>
        <input class="inp" type="date" id="onw" value="${esc(c.on||fmtD(new Date()))}">
        <p class="hint" style="margin-top:4px">Defaults to today. Change it only if the work was actually done on an earlier date — the curve plots it here.</p>
        ${c.by?`<p class="hint">Last set by ${esc(c.by)}${c.at?' · '+new Date(c.at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}</p>`:''}
      </div>
      <div class="modal-f"><button class="btn dim" id="x">Cancel</button><button class="btn" id="ok">Save</button></div>
    </div></div>`;
    const wrap=$('#pctwrap'), rng=$('#rng'), pv=$('#pv'), ntl=$('#ntl');
    function sync(){ layer.querySelectorAll('.sbtn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===st))); wrap.hidden=st!==S.IP; ntl.textContent=st===S.BLOCKED?'Why is it blocked?':'Note'; }
    sync();
    layer.querySelectorAll('.sbtn').forEach(b=>b.onclick=()=>{ st=b.dataset.s; if(st===S.IP&&!pc){pc=50;rng.value=50;pv.textContent='50%';} sync(); });
    rng.oninput=()=>{ pc=+rng.value; pv.textContent=pc+'%'; };
    layer.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ pc=+b.dataset.c; rng.value=pc; pv.textContent=pc+'%'; });
    const close=()=>layer.innerHTML='';
    $('#x').onclick=close;
    $('#scrim').onclick=e=>{ if(e.target.id==='scrim') close(); };
    document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',k);} });
    $('#ok').onclick=async()=>{ if(st===S.IP&&pc>=100)st=S.DONE; if(st===S.IP&&pc<=0)st=S.NS; const note=$('#nt').value.trim(); const on=$('#onw')?$('#onw').value:''; close(); await saveCell(aid,rid,pid,{status:st,pct:st===S.IP?pc:(st===S.DONE?100:0),note,on}); };
    setTimeout(()=>{ const f=layer.querySelector('.sbtn[aria-pressed="true"]')||layer.querySelector('.sbtn'); f&&f.focus(); },0);
  }

  function promptModal(title,label,value,onok){

      <div class="modal-h"><b>${esc(title)}</b></div>

      ? `<div class="mlist">${tplIndex.map(t=>`<div class="mrow"><span class="mname">${esc(t.name)}</span>

          <button class="btn dim danger sm" data-deltpl="${t.id}" aria-label="Delete template">×</button></div>`).join('')}</div>`
      : `<p class="hint" style="margin-top:0">No templates yet. Set up a project the way you like it, then “Save current setup as template” — every new project can start from it.</p>`;
    layer.innerHTML=`<div class="scrim" id="scrimP"><div class="modal" role="dialog" aria-modal="true" aria-label="Projects">
      <div class="modal-h"><b>Projects</b><span>${projIndex.length} active</span></div>
      <div class="modal-b">
        <div class="sec" style="margin-top:0">Start a new project</div>

          <button class="btn" id="pimp">Import a project file…</button>
          <button class="btn dim" id="pnew">Blank project</button>
          <input type="file" id="pimpfile" style="display:none">
        </div>
        <div class="sec">Templates</div>
        ${tpls}

        <div class="mact">
          <button class="btn dim" id="psavetpl">Save current setup as template</button>
          <button class="btn dim" id="pdup">Duplicate this project</button>
          <button class="btn dim danger" id="pdel">Delete this project</button>
        </div>
        <p class="hint" style="margin-top:0">Templates copy structure only — areas, phases, rows and weights — never progress. Everyone on the shared link sees the same list of projects; each device remembers which one it's viewing.</p>
      </div>
      <div class="modal-f"><button class="btn" id="pclose">Close</button></div>
    </div></div>`;
    const close=()=>layer.innerHTML='';
    $('#pclose').onclick=close; $('#scrimP').onclick=e=>{ if(e.target.id==='scrimP') close(); };
    $('#pnew').onclick=()=>{ close(); promptModal('New blank project','Project name','', n=>createProject(n)); };
    $('#pimp').onclick=()=>{ const f=$('#pimpfile'); if(f) f.click(); };
    $('#pimpfile').onchange=e=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{
        let data; try{ data=JSON.parse(rd.result); }catch(err){ toast('Not a valid tracker file'); return; }
        close();
        if(data.kind==='sprinkler-tracker-backup') return importBackup(data);
        if(data.kind==='sprinkler-tracker-project'&&data.doc) return importProject(data.doc);
        toast('Unrecognised file');
      };
      rd.onerror=()=>toast('Could not read file');
      rd.readAsText(f);
    };
    $('#pdup').onclick=()=>{ close(); duplicateProject(); };
    $('#psavetpl').onclick=()=>{ close(); promptModal('Save as template','Template name',doc.project.name+' template', n=>saveTemplate(n)); };
    $('#pdel').onclick=()=>{ if(confirm('Delete “'+doc.project.name+'” and all its progress? This cannot be undone.')){ const id=activeId; close(); deleteProject(id); } };
    layer.querySelectorAll('[data-usetpl]').forEach(b=>b.onclick=()=>{ const tid=b.dataset.usetpl; close(); promptModal('New project from template','Project name','', n=>createProject(n,tid)); });
    layer.querySelectorAll('[data-deltpl]').forEach(b=>b.onclick=()=>{ if(confirm('Delete this template? Projects already created from it are unaffected.')) deleteTemplate(b.dataset.deltpl); });
    setTimeout(()=>$('#pnew').focus(),0);
  }

  // do these two documents descend from the same export? compares structural IDs
  function kinship(local,incoming){
    const mine={}; local.areas.forEach(a=>mine[a.id]=1);
    let shared=0; incoming.areas.forEach(a=>{ if(mine[a.id]) shared++; });
    return {shared,total:incoming.areas.length,related:shared>0};
  }

  function importProject(incoming){
    const inc=normalize(incoming);
    const kin=kinship(doc,inc);
    const warn=kin.related?'':`<div class="blk" style="border-left-color:var(--red);margin-bottom:10px">
        <h4>Different project</h4>
        <p>This file doesn't share any structure with “${esc(doc.project.name)}”. Merging would discard its progress rather than combining it. Use <b>Add as a new project</b> instead, unless you're deliberately replacing.</p></div>`;
    layer.innerHTML=`<div class="scrim" id="scrimI"><div class="modal" style="max-width:360px" role="dialog" aria-modal="true" aria-label="Import">
      <div class="modal-h"><b>Import</b><span>${esc(inc.project.name||'project')}</span></div>
      <div class="modal-b">
        ${warn}
        <p class="hint" style="margin-top:0">${Object.keys(inc.cells||{}).length} logged cells · ${(inc.burned||[]).length} burned-hour weeks</p>
        <div class="mact">
          <button class="btn" id="irep">Replace everything</button>
          <button class="btn dim" id="inew">Add as a new project</button>
          <button class="btn dim" id="imerge" ${kin.related?'':'disabled style="opacity:.4"'}>Their progress, my setup</button>
          <button class="btn dim" id="iadopt" ${kin.related?'':'disabled style="opacity:.4"'}>Their setup, my progress</button>
        </div>
        <p class="hint"><b>Replace</b> — setting this device up for the first time.<br>
        <b>Their progress, my setup</b> — folding in a foreman's weekly file.<br>
        <b>Their setup, my progress</b> — receiving a revised schedule.</p>
      </div>
      <div class="modal-f"><button class="btn dim" id="ix">Cancel</button></div></div></div>`;
    const close=()=>layer.innerHTML='';
    $('#ix').onclick=close; $('#scrimI').onclick=e=>{ if(e.target.id==='scrimI') close(); };
    $('#imerge').onclick=async()=>{ if(!kin.related) return; const m=mergeDoc(doc,inc); doc=m.doc; close(); await save(); toast('Merged '+m.cells+' cells, '+m.weeks+' weeks'); };
    $('#iadopt').onclick=async()=>{
      if(!kin.related) return;
      const m=adoptSetup(doc,inc); doc=m.doc; activeArea=doc.areas[0]?doc.areas[0].id:null; close(); await save();
      toast('Setup updated · '+m.kept+' entries kept'+(m.dropped?' · '+m.dropped+' dropped':''));
    };
    $('#irep').onclick=async()=>{ if(!confirm('Replace this project entirely?')) return; doc=inc; close(); await save(); toast('Replaced'); };
    $('#inew').onclick=async()=>{
      activeId=uid('proj'); doc=inc; upsertIndexEntry();
      await sset(PKEY(activeId),doc,true); await sset(PIDX,projIndex,true); await sset(ACTIVE,activeId,false);
      activeArea=doc.areas[0]?doc.areas[0].id:null; close(); render(); toast('Added as new project');
    };
  }
  async function importBackup(data){
    if(!confirm('Restore a full backup? This replaces every project and template on this device.')) return;
    for(const p of (data.projs||[])) await sset(PKEY(p.id),normalize(p.doc),true);
    for(const t of (data.tpls||[])) await sset(TKEY(t.id),t.tpl,true);
    projIndex=data.projIndex||[]; tplIndex=data.tplIndex||[];
    await sset(PIDX,projIndex,true); await sset(TIDX,tplIndex,true);
    if(projIndex.length){ activeId=projIndex[0].id; await sset(ACTIVE,activeId,false); doc=normalize(await sget(PKEY(activeId),true)||seed()); activeArea=doc.areas[0]?doc.areas[0].id:null; }
    render(); toast('Backup restored');
  }

  async function sendUpdate(){
    const text=exportProject();
    const name=safeName(doc.project.name)+'-'+stamp()+'.json';
    try{
      if(typeof File!=='undefined' && navigator.canShare && navigator.share){
        const file=new File([text],name,{type:'application/json'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:doc.project.name,
            text:doc.project.name+' — progress to week ending '+thisWeekEnd()+(me?' — '+me:'')});
          return;
        }
      }
    }catch(e){ if(e && e.name==='AbortError') return; }
    download(name,text);
  }

  // ---------- export ----------
  function drawSummary(){
    const L=[doc.project.name+'  |  Job '+doc.project.number+'  |  '+doc.project.gc, 'Percent complete as of '+new Date().toLocaleDateString(),''];
    doc.areas.forEach(a=>{
      L.push(a.name.toUpperCase()+'  ('+TPL[a.kind].label+')');
      a.phases.forEach(p=>L.push('  '+p.name.padEnd(16)+String(r1(phasePct(a,p))).padStart(6)+'%'));
      L.push('  '+'— area —'.padEnd(16)+String(r1(areaPct(a))).padStart(6)+'%'); L.push('');
    });
    L.push('PROJECT TOTAL'.padEnd(18)+String(r1(projectPct())).padStart(6)+'%');
    return L.join('\n');
  }
  function csv(){
    const rows=[['Area','Type','Row','Phase','Percent']];
    doc.areas.forEach(a=>a.rows.forEach(r=>a.phases.forEach(p=>rows.push([a.name,TPL[a.kind].label,r.name,p.name,r1(pctOf(cell(a.id,r.id,p.id)))]))));
    return rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')).join('\n');
  }
  function blockerText(){
    const L=[doc.project.name+' — blockers as of '+new Date().toLocaleDateString(),'']; let n=0;
    doc.areas.forEach(a=>a.rows.forEach(r=>a.phases.forEach(p=>{ const c=cell(a.id,r.id,p.id); if(c.status===S.BLOCKED){ n++; L.push(n+'. '+a.name+' · '+r.name+' · '+p.name+' — '+(c.note||'no reason logged')+(c.by?' ('+c.by+')':'')); } })));
    if(!n) L.push('None.'); return L.join('\n');
  }
  function curveText(){
    const s=curveSeries(); if(!s) return 'No baseline set.';
    const rows=[['Week ending','Planned %','Planned hours','Earned %','Earned hours','Burned %','Burned hours']];
    s.weeks.forEach((t,i)=>{
      const d=new Date(t+6*DAY);
      rows.push([fmtD(d),r1(s.planned[i]),r1(s.planned[i]/100*s.total),
        s.actual?r1(s.actual[i]):'',s.actual?r1(s.actual[i]/100*s.total):'',
        s.burned?r1(s.burned[i]):'',s.burned?r1(s.burned[i]/100*s.total):'']);
    });
    return rows.map(r=>r.join(',')).join('\n');
  }
  async function copy(t){
    try{ await navigator.clipboard.writeText(t); toast('Copied'); }
    catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copied'); }catch(_){ toast('Copy failed'); } ta.remove(); }
  }

  // ---------- events ----------
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ view=t.dataset.v; render(); });
  $('#refresh').onclick=async()=>{ await reloadDoc(); toast('Refreshed'); };
  $('#who').onclick=askName;
  $('#projbtn').onclick=openProjects;
  $('#send').onclick=sendUpdate;
  $('#projsel').onchange=e=>switchProject(e.target.value);
  const commit=()=>{ clearTimeout(dirtyTimer); dirtyTimer=setTimeout(()=>save(undefined,true),400); };
  const parse=v=>{ const [id,i]=v.split('|'); return [id, i===undefined?undefined:+i]; };
  function refreshHourTags(){
    if(labour()){
      doc.areas.forEach(a=>{ const wt=document.querySelector('[data-wtag="'+a.id+'"]'); if(wt) wt.textContent=r1(areaHours(a))+' h'; });
    } else {
      const ph=document.querySelector('[data-projhrs]'); if(ph) ph.textContent=r1(infoProjectHours())+' h';
    }
  }

  pane.addEventListener('click',e=>{
    const c=e.target.closest('.cell'); if(c){ if(!busy) openCell(c.dataset.a,c.dataset.r,c.dataset.p); return; }
    const pill=e.target.closest('.pill'); if(pill){ activeArea=pill.dataset.area; render(); return; }
    const tog=e.target.closest('[data-atoggle]'); if(tog){ const id=tog.dataset.atoggle; setupOpen = setupOpen===id?null:id; paintAreas(); return; }
    const b=e.target.closest('button'); if(!b) return; const id=b.id;

    if(id==='cpsum') return copy(drawSummary());
    if(id==='cpcsv') return copy(csv());
    if(id==='cpblk') return copy(blockerText());

    if(id==='add-building'){ const a=seedArea('woodframe','Building '+nextBuildingLetter(),['L04','L03','L02','L01']); doc.areas.push(a); setupOpen=a.id; return save(false); }
    if(id==='add-parkade'){ const a=seedArea('parkade','Parkade',['P1','P2']); doc.areas.push(a); setupOpen=a.id; return save(false); }
    if(id==='add-valve'){ const a=seedArea('valveroom','Valve Room',['Valve Room']); doc.areas.push(a); setupOpen=a.id; return save(false); }
    if(id==='clr'){ if(!confirm('Clear all progress? Areas, phases and rows stay.')) return; doc.cells={}; doc.burned=[]; doc.updated=null; doc.by=null; return save(false); }
    if(id==='reset'){ if(!confirm('Reset THIS project back to the default structure? Wipes its areas and progress. Other projects are untouched.')) return; doc=seed(); activeArea=doc.areas[0].id; setupOpen=null; return save(false); }
    if(id==='wm-manual'){ doc.weightMode='manual'; return save(false); }
    if(id==='wm-labour'){ doc.weightMode='labour'; return save(false); }
    if(id==='dpw-5'){ doc.schedule.daysPerWeek=5; return save(false); }
    if(id==='dpw-6'){ doc.schedule.daysPerWeek=6; return save(false); }
    if(id==='cpcurve') return copy(curveText());
    if(id==='exp1'){ return download(safeName(doc.project.name)+'-'+stamp()+'.json',exportProject()); }
    if(id==='expall'){ return exportAll().then(t=>download('sprinkler-tracker-backup-'+stamp()+'.json',t)); }
    if(id==='expcsv'){ return download(safeName(doc.project.name)+'-curve-'+stamp()+'.csv',curveText(),'text/csv'); }
    if(id==='impbtn'){ const f=$('#impfile'); if(f) f.click(); return; }
    if(id==='baddb'){
      const w=$('#bw').value, hh=+$('#bh').value||0;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(w)){ toast('Pick a week ending date'); return; }
      if(hh<=0){ toast('Enter hours'); return; }
      if(!doc.burned) doc.burned=[];
      const ex=doc.burned.find(b=>b.week===w);
      if(ex){ if(!confirm('An entry for '+w+' already exists ('+ex.hours+' h). Replace it?')) return; ex.hours=hh; ex.by=me||''; }
      else doc.burned.push({id:uid('b'),week:w,hours:hh,by:me||''});
      return save();
    }
    if(b.dataset.bdel!==undefined){ const bid=b.dataset.bdel; doc.burned=(doc.burned||[]).filter(x=>x.id!==bid); return save(); }

    // per-area dataset buttons
    let d;
    if((d=b.dataset.addp)!==undefined){ areaById(d).phases.push({id:uid('p'),name:'New phase',weight:10}); return save(false); }
    if((d=b.dataset.defp)!==undefined){ const a=areaById(d); a.phases=makePhases(a.kind); pruneArea(a.id); return save(false); }
    if((d=b.dataset.addr)!==undefined){ areaById(d).rows.push({id:uid('r'),name:'New',heads:0}); return save(false); }
    if((d=b.dataset.ad)!==undefined){ if(!confirm('Delete this area and its progress?')) return; pruneArea(d); doc.areas=doc.areas.filter(a=>a.id!==d); if(activeArea===d) activeArea=doc.areas[0]?doc.areas[0].id:null; setupOpen=null; return save(false); }
    if((d=b.dataset.gen)!==undefined){
      const a=areaById(d);
      const pre=($('[data-genp="'+d+'"]').value||'').trim();
      const x=parseInt($('[data-gena="'+d+'"]').value,10), y=parseInt($('[data-genb="'+d+'"]').value,10);
      if(isNaN(x)||isNaN(y)||y<x){ toast('Check the range'); return; }
      if(y-x>199){ toast('Too many rows'); return; }
      const out=[]; const desc=TPL[a.kind].dir==='desc';
      const seq=[]; for(let i=x;i<=y;i++) seq.push(i); if(desc) seq.reverse();
      seq.forEach(i=>out.push({id:uid('r'),name:pre+String(i).padStart(pre?2:0,'0'),heads:0}));
      pruneArea(a.id); a.rows=out; return save(false);
    }
    if((d=b.dataset.pd)!==undefined){ const [id2,i]=parse(d); areaById(id2).phases.splice(i,1); return save(false); }
    if((d=b.dataset.rd)!==undefined){ const [id2,i]=parse(d); areaById(id2).rows.splice(i,1); return save(false); }
    if((d=b.dataset.up)!==undefined){ const [id2,i]=parse(d); const a=areaById(id2); if(i>0){ [a.rows[i-1],a.rows[i]]=[a.rows[i],a.rows[i-1]]; } return save(false); }
    if((d=b.dataset.down)!==undefined){ const [id2,i]=parse(d); const a=areaById(id2); if(i<a.rows.length-1){ [a.rows[i+1],a.rows[i]]=[a.rows[i],a.rows[i+1]]; } return save(false); }
  });

  pane.addEventListener('change',e=>{
    const t=e.target; let d;
    if(t.id==='impfile'){
      const f=t.files&&t.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>{
        let data; try{ data=JSON.parse(rd.result); }catch(err){ toast('Not a valid file'); return; }
        t.value='';
        if(data.kind==='sprinkler-tracker-backup') return importBackup(data);
        if(data.kind==='sprinkler-tracker-project'&&data.doc) return importProject(data.doc);
        toast('Unrecognised file');
      };
      rd.onerror=()=>toast('Could not read file');
      rd.readAsText(f); return;
    }
    if((d=t.dataset.ak)!==undefined){ const a=areaById(d); a.kind=t.value; a.phases=makePhases(t.value); a.seq=defSeq(t.value); a.pace=defPace(t.value); pruneArea(a.id); return save(false); }
    if((d=t.dataset.pm)!==undefined){ const [id,i]=parse(d); areaById(id).phases[i].mode=t.value; return save(false); }
    if((d=t.dataset.as)!==undefined){ areaById(d).start=t.value; return save(false); }
    if((d=t.dataset.aq)!==undefined){ areaById(d).seq=t.value; return save(false); }
    if((d=t.dataset.ap)!==undefined){ areaById(d).pace=t.value; return save(false); }
    if((d=t.dataset.ps)!==undefined){ const [id,i]=parse(d); areaById(id).phases[i].start=t.value; return save(false); }
  });

  pane.addEventListener('input',e=>{
    const t=e.target; let d;
    if(t.id==='f-name') doc.project.name=t.value;
    else if(t.id==='f-num') doc.project.number=t.value;
    else if(t.id==='f-gc') doc.project.gc=t.value;
    else if(t.id==='f-rev') doc.project.rev=t.value;
    else if((d=t.dataset.an)!==undefined){ areaById(d).name=t.value; const nm=document.querySelector('[data-atoggle="'+d+'"] .nm'); if(nm) nm.textContent=t.value; }
    else if((d=t.dataset.aw)!==undefined){ areaById(d).weight=Math.max(0,+t.value||0); const wt=document.querySelector('[data-wtag="'+d+'"]'); if(wt) wt.textContent='W '+areaById(d).weight; }
    else if(t.id==='hph'){ doc.hoursPerHead=Math.max(0,+t.value||0); refreshHourTags(); }
    else if((d=t.dataset.th)!==undefined){ areaById(d).totalHours=Math.max(0,+t.value||0); refreshHourTags(); }
    else if((d=t.dataset.rh)!==undefined){ const [id,i]=parse(d); areaById(id).rows[i].heads=Math.max(0,+t.value||0); refreshHourTags(); }
    else if((d=t.dataset.pn)!==undefined){ const [id,i]=parse(d); areaById(id).phases[i].name=t.value; }
    else if((d=t.dataset.pw)!==undefined){ const [id,i]=parse(d); const a=areaById(id); a.phases[i].weight=Math.max(0,+t.value||0);
      const wt=document.querySelector('[data-wtot="'+id+'"]');
      if(wt){ const tot=a.phases.reduce((s,p)=>s+(+p.weight||0),0); wt.textContent='weights total '+tot; wt.className='tot'+(tot!==100?' bad':''); } }
    else if(t.id==='hols'){ doc.schedule.holidays=t.value; }
    else if(t.id==='hpd'){ doc.schedule.hoursPerDay=Math.max(1,+t.value||8); }
    else if((d=t.dataset.ac)!==undefined){ areaById(d).crew=Math.max(1,+t.value||1); }
    else if((d=t.dataset.ad2)!==undefined){ areaById(d).spreadDays=Math.max(0,+t.value||0); }
    else if((d=t.dataset.pc)!==undefined){ const [id,i]=parse(d); areaById(id).phases[i].cycle=Math.max(0,+t.value||0); }
    else if((d=t.dataset.psp)!==undefined){ const [id,i]=parse(d); areaById(id).phases[i].span=Math.max(1,+t.value||1); }
    else if((d=t.dataset.pl)!==undefined){ const [id,i]=parse(d); areaById(id).phases[i].lag=Math.max(0,+t.value||0); }
    else if((d=t.dataset.rn)!==undefined){ const [id,i]=parse(d); areaById(id).rows[i].name=t.value; }
    else return;
    paintHead(); commit();
  });

  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !busy && !layer.innerHTML) reloadDoc(); });
  boot();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
