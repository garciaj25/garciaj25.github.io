<title>Control Documental de Obra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0A1628">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy brand header (same as the PM Dynamics demos); project rail on the left, the selected project on the right: summary, three phase cards, each a list of documents. Report view replaces the main column. Stacks at phone width. */
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --surface-2:#FBF8F3; --ink:#0A1628; --muted:#5C6573; --line:#E5DED1;
  --accent:#0D7377; --accent-soft:#D7EDEC; --gold:#C9A84C; --gold-ink:#8A6D1F;
  --hero:#0A1628; --on-hero:#FFFFFF;
  --good:#1E7A4C; --good-soft:#DDF1E6; --warn:#A86300; --warn-soft:#FBEBD3; --bad:#B4232A; --bad-soft:#F9DEDF;
  --wait:#5B47A8; --wait-soft:#ECE8F8; --na:#6B7280; --na-soft:#ECEAE6;
  --shadow:0 1px 2px rgba(10,22,40,.06),0 8px 24px rgba(10,22,40,.08);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"DM Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1628; --surface:#112038; --surface-2:#16284A; --ink:#EEF1F5; --muted:#9AA6B8; --line:#24375A;
  --accent:#3FB5B9; --accent-soft:#0F3A40; --gold:#D9BC6A; --gold-ink:#D9BC6A; --hero:#06101F; --on-hero:#FFFFFF;
  --good:#4CC38A; --good-soft:#15342A; --warn:#E3A548; --warn-soft:#3A2C14; --bad:#F06A5F; --bad-soft:#3D1C1C;
  --wait:#A796EE; --wait-soft:#2A2550; --na:#9AA6B8; --na-soft:#1D2D4A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1628; --surface:#112038; --surface-2:#16284A; --ink:#EEF1F5; --muted:#9AA6B8; --line:#24375A;
  --accent:#3FB5B9; --accent-soft:#0F3A40; --gold:#D9BC6A; --gold-ink:#D9BC6A; --hero:#06101F; --on-hero:#FFFFFF;
  --good:#4CC38A; --good-soft:#15342A; --warn:#E3A548; --warn-soft:#3A2C14; --bad:#F06A5F; --bad-soft:#3D1C1C;
  --wait:#A796EE; --wait-soft:#2A2550; --na:#9AA6B8; --na-soft:#1D2D4A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.page{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.1px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
a{color:var(--accent)}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;justify-content:space-between;background:var(--hero);color:var(--on-hero);border-radius:12px;padding:18px 22px;border-bottom:3px solid var(--gold)}
.brand{display:grid;gap:3px;min-width:0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.16em;font-weight:600;color:var(--gold)}
header.top h1{font-size:30px;line-height:1.1}
.sub{opacity:.75;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--gold);color:var(--gold)}
.top-links{display:flex;gap:8px;flex-wrap:wrap}
.top-links a{color:var(--on-hero);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.3)}
.top-links a:hover{border-color:var(--on-hero)}
.top-links a.primary{background:var(--accent);border-color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.btn.small{padding:5px 10px;font-size:13px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:4px}

.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}

/* rail */
.rail{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.rail{position:static}}
.rail-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.rail-h h2{font-size:18px}
.plist{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:2px;max-height:55vh;overflow:auto}
.pitem{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:10px}
.pitem:hover{background:var(--surface-2)}
.pitem[aria-current="true"]{background:var(--surface-2);border-color:var(--line);box-shadow:inset 3px 0 0 var(--gold)}
.pitem .nm{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .r2{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:4px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent)}
.rail-foot{padding:10px;border-top:1px solid var(--line);display:grid;gap:6px}
.rail-note{font-size:12px;color:var(--muted);padding:0 12px 12px}
.ex{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--gold-ink);border:1px solid var(--gold);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:2px}

/* main */
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.phead{padding:18px 20px;display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:space-between;align-items:flex-end}
.phead h2{font-size:28px;line-height:1.1}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13.5px;margin-top:6px}
.meta b{color:var(--ink);font-weight:600}
.count{text-align:right}
.count .big{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1}
.count .big.past{color:var(--muted);font-size:26px}
.pactions{display:flex;gap:8px;flex-wrap:wrap;width:100%}

.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
@media (max-width:620px){.phases{grid-template-columns:minmax(0,1fr)}}
.ph{padding:14px 20px;border-right:1px solid var(--line);display:grid;gap:6px;background:none;border-top:0;border-bottom:0;border-left:0;text-align:left}
.ph:last-child{border-right:0}
@media (max-width:620px){.ph{border-right:0;border-bottom:1px solid var(--line)}.ph:last-child{border-bottom:0}}
.ph .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph .nm{font-family:var(--f-display);font-weight:600;font-size:18px}
.ph .pct{font-family:var(--f-mono);font-size:14px;font-weight:500}
.ph .bar{margin-top:0;height:8px}
.ph.done .bar i{background:var(--good)}
.ph small{color:var(--muted);font-size:12.5px}

.stats{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line);align-items:center}
.stats .label{margin-right:4px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:baseline}
.fchip b{font-family:var(--f-mono);font-weight:500}
.fchip.bad b{color:var(--bad)} .fchip.warn b{color:var(--warn)} .fchip.wait b{color:var(--wait)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed="true"] b{color:inherit}

.grp-h{padding:16px 20px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.grp-h h3{font-size:22px}
.grp-h .label{display:block;margin-bottom:2px;color:var(--gold-ink)}
.grp-h p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.docs{list-style:none;margin:0;padding:0}
.doc{padding:14px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;position:relative}
.doc:last-child{border-bottom:0}
.doc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.doc.overdue::before{background:var(--bad)} .doc.soon::before{background:var(--warn)} .doc.wait::before{background:var(--wait)} .doc.closed::before{background:var(--good)}
@media (max-width:700px){.doc{grid-template-columns:minmax(0,1fr)}}
.ttl{font-weight:600}
.doc.closed .ttl{color:var(--muted)}
.det{color:var(--muted);font-size:13px;margin-top:2px;max-width:70ch}
.custom-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-left:6px;font-weight:600}
.rm{background:none;border:0;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:0;margin-left:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:34px;align-self:start}
.seg button{border:0;background:var(--surface);font-size:13px;font-weight:600;border-right:1px solid var(--line);padding:0 11px;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2);color:var(--ink)}
.seg button[aria-pressed="true"][data-v="rec"]{background:var(--good);color:#FFFFFF}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--na);color:#FFFFFF}
.seg button[aria-pressed="true"][data-v="esp"]{background:var(--wait);color:#FFFFFF}
.fields{grid-column:1/-1;display:grid;grid-template-columns:170px minmax(140px,220px) minmax(0,1fr);gap:8px;align-items:center}
@media (max-width:700px){.fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fields .fnote{grid-column:1/-1}}
.fld{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 9px;font-size:13.5px;min-width:0}
.fld:focus{background:var(--surface)}
.fld.auto{border-style:dashed;color:var(--muted)}
.duebox{display:grid;gap:3px}
.rel{font-size:12px;color:var(--muted)}
.rel.overdue{color:var(--bad);font-weight:600} .rel.soon{color:var(--warn);font-weight:600}
/* sub-tasks inside an activity */
.prog{display:grid;gap:5px;justify-items:end;align-self:start;min-width:150px}
.prog .t{font-size:13px;font-weight:600}
.prog .bar{width:150px;margin:0;height:7px}
.doc.closed .prog .bar i{background:var(--good)}
.subs{grid-column:1/-1;list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.sub{display:grid;grid-template-columns:minmax(0,1.1fr) 150px minmax(110px,150px) minmax(0,1.2fr) auto;gap:8px;align-items:center;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);position:relative}
.sub:last-child{border-bottom:0}
.sub::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.sub.overdue::before{background:var(--bad)} .sub.soon::before{background:var(--warn)} .sub.wait::before{background:var(--wait)} .sub.closed::before{background:var(--good)}
.sub .sn{font-size:14px;font-weight:500;min-width:0}
.sub.closed .sn{color:var(--muted)}
.sub .sn .rel{display:block;margin-top:1px}
.sub .fld{background:var(--surface);padding:5px 8px;font-size:13px}
.seg.sm{height:30px}
.seg.sm button{font-size:12px;padding:0 8px}
@media (max-width:860px){.sub{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sub .sn,.sub .snote{grid-column:1/-1}.sub .seg{grid-column:1/-1;justify-self:start}}
.sub-add{display:flex;gap:8px;padding:8px 10px;border-top:1px dashed var(--line);background:var(--surface)}
.subs:empty+.sub-add,.sub-add.solo{border:1px dashed var(--line);border-radius:8px}
.sub-add input{flex:1;min-width:0}
.sub-wrap{grid-column:1/-1;display:grid;gap:0}
.sub-wrap .subs{border-bottom-left-radius:0;border-bottom-right-radius:0}
.sub-wrap .subs+.sub-add{border:1px solid var(--line);border-top:1px dashed var(--line);border-radius:0 0 8px 8px}
.split{grid-column:1/-1;justify-self:start;background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:600}
.split:hover{text-decoration:underline}
tr.subrow td:first-child{padding-left:26px;color:var(--muted)}
tr.parent td{font-weight:600}
.add-row{display:flex;gap:8px;padding:12px 20px;border-top:1px dashed var(--line)}
.add-row input{flex:1;min-width:0}
.empty{padding:16px 20px;color:var(--muted);font-size:14px}

/* editor */
.editor{padding:20px}
.editor h2{font-size:24px;margin-bottom:14px}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.grid-f label{display:flex;flex-direction:column;gap:4px}
.grid-f input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:8px 10px;min-width:0}
.ed-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.ed-actions .sp{flex:1}
.hint{color:var(--muted);font-size:13px;margin-top:12px;max-width:75ch}

/* report */
.report{padding:24px;display:grid;gap:18px}
.rep-h{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
.rep-h h2{font-size:26px}
.rep-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.rep-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.bad .v{color:var(--bad)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:620px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
caption{text-align:left;font-family:var(--f-display);font-weight:600;font-size:18px;padding:4px 0 8px}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--na-soft);color:var(--muted)}
.st.rec{background:var(--good-soft);color:var(--good)} .st.na{background:var(--na-soft);color:var(--na)}
.st.esp{background:var(--wait-soft);color:var(--wait)} .st.overdue{background:var(--bad-soft);color:var(--bad)} .st.soon{background:var(--warn-soft);color:var(--warn)}
.rep-foot{color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.rep-actions{display:flex;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:10;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}

@media print{
  body{background:#fff;color:#000;padding:0}
  header.top,.rail,.rep-actions,.toast{display:none!important}
  .wrap{display:block}
  .card{border:0}
  table{min-width:0}
}
</style>

<div class="page">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">PM Dynamics · Demo</span>
      <h1>Control Documental de Obra</h1>
      <div class="sub"><span>Inicio, construcción y cierre de cada proyecto en una sola lista</span><span class="tag">Funciona sin internet</span></div>
    </div>
    <nav class="top-links" aria-label="Enlaces">
      <a href="https://pmdynamicsconsulting.com/" target="_blank" rel="noopener">← pmdynamicsconsulting.com</a>
      <a class="primary" href="https://pmdynamicsconsulting.com/#contacto" target="_blank" rel="noopener">¿Quieres una herramienta así? Consulta gratuita →</a>
    </nav>
  </header>

  <div class="wrap">
    <aside class="rail" aria-label="Proyectos">
      <div class="rail-h"><h2>Proyectos</h2><span class="label" id="pcount"></span></div>
      <ul class="plist" id="plist"></ul>
      <div class="rail-foot">
        <button class="btn primary block" id="newBtn" type="button">+ Nuevo proyecto</button>
        <button class="btn small block" id="resetBtn" type="button">Restablecer el ejemplo</button>
      </div>
      <p class="rail-note" id="saveNote">Los datos se guardan solo en este navegador. No salen de tu equipo.</p>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Each activity is due relative to the project's start date ('ini') or delivery date ('fin'). off = days after that date (negative = before).
   add = placeholder for activities that normally hold several sub-tasks (actas, cortes, pruebas por piso). Any activity can be split into sub-tasks. */
const D=(id,t,ref,off,d,add)=>({id,t,ref,off,d:d||'',add:add||''});
const PHASES=[
 {key:'ini',n:'Fase 1',title:'Inicio',desc:'Lo que debe estar firmado y vigente antes de entrar a obra.',items:[
  D('contrato','Contrato u orden de servicio firmado','ini',-10),
  D('polizas','Pólizas del contrato aprobadas','ini',-5,'Con recibo de pago y aprobación del contratante.','Agregar póliza'),
  D('anticipo','Póliza de buen manejo del anticipo','ini',-5,'Solo si el contrato tiene anticipo.'),
  D('acta','Acta de inicio firmada','ini',0),
  D('personal','Listado del personal con cédulas','ini',-3),
  D('ss','Afiliaciones a seguridad social y ARL (planilla PILA)','ini',-3,'Nadie entra a obra sin ARL vigente.'),
  D('alturas','Certificados de trabajo en alturas vigentes','ini',-3),
  D('sst','Plan de SG-SST y matriz de riesgos del proyecto','ini',-3),
  D('planos','Planos aprobados para construcción','ini',0),
  D('presu','Presupuesto y cuadro de cantidades aprobado','ini',0),
  D('crono','Cronograma inicial aprobado','ini',7),
  D('fichas','Fichas técnicas de materiales aprobadas','ini',15,'Rociadores, válvulas y tubería con listado UL o aprobación FM.')]},
 {key:'con',n:'Fase 2',title:'Construcción',desc:'Registros que se repiten durante la obra. Agrega cada acta, corte o prueba como subtarea.',items:[
  D('bitacora','Bitácora de obra al día','ini',30,'Revisión mensual.'),
  D('comite','Actas de comité de obra','ini',30,'Una por cada comité.','Agregar acta (ej. Comité No. 8)'),
  D('cortes','Actas de corte de obra para facturar','ini',30,'Una por cada corte de facturación.','Agregar corte (ej. Corte No. 5)'),
  D('hidro','Pruebas hidrostáticas por piso o zona','fin',-60,'200 psi durante 2 horas (NFPA 13), firmadas por la interventoría.','Agregar prueba (ej. Pisos 13 y 14)'),
  D('interv','Informes de inspección de la interventoría','fin',-40,'','Agregar informe'),
  D('pila','Pago mensual de seguridad social del personal','ini',30,'','Agregar mes'),
  D('cambios','Órdenes de cambio aprobadas por escrito','fin',-30,'Lo que no está firmado no se cobra.','Agregar orden de cambio (ej. OC-08)')]},
 {key:'cie',n:'Fase 3',title:'Cierre',desc:'Lo que necesitas para entregar, liquidar y cobrar la retención.',items:[
  D('pfinal','Pruebas finales del sistema','fin',-20,'','Agregar prueba'),
  D('asbuilt','Planos récord (as-built)','fin',-15),

let state={projects:[],sel:null};let canStore=true;
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.projects))state=s}}catch(e){canStore=false}
  if(!state.projects.length){state.projects=[sample()];state.sel='ejemplo'}
}
function persist(){if(!canStore)return;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){canStore=false;$('#saveNote').textContent='Este navegador no permite guardar. Los cambios se pierden al cerrar la página.'}}
const cur=()=>state.projects.find(p=>p.id===state.sel);

/* ---------- logic ---------- */
function docsFor(p,phase){
  const out=phase.items.map(it=>({...it}));
  Object.entries(p.items||{}).filter(([k,v])=>v&&v.custom&&v.phase===phase.key&&!v.deleted)
    .sort((a,b)=>(a[1].created||0)-(b[1].created||0))
    .forEach(([k,v])=>out.push({id:k,t:v.text,ref:phase.key==='ini'?'ini':'fin',off:phase.key==='ini'?0:-10,d:'',add:'Agregar subtarea',custom:true}));
  return out;
}
function flagOf(status,dd){
  if(status==='rec'||status==='na')return'closed';
  if(status==='esp')return'wait';
  if(dd!==null&&dd<0)return'overdue';
  if(dd!==null&&dd<=7)return'soon';
  return'';
}
function subsOf(p,it){
  const m=((p.items||{})[it.id]||{}).subs||{};
  return Object.entries(m).filter(([k,v])=>v&&!v.deleted).map(([k,v])=>({id:k,...v})).sort((a,b)=>(a.o??a.created??0)-(b.o??b.created??0));
}
function docState(p,it){
  const s=(p.items||{})[it.id]||{};
  const base=parseD(it.ref==='ini'?p.start:p.end);
  let due=parseD(s.due),auto=false;
  if(!due&&base){due=addD(base,it.off);auto=true}
  const dd=due?days(due,today()):null;
  const subs=subsOf(p,it).map(sb=>{let sdue=parseD(sb.due),sauto=false;if(!sdue&&due){sdue=due;sauto=true}
    const sdd=sdue?days(sdue,today()):null;return{sb,status:sb.status||'',due:sdue,auto:sauto,dd:sdd,flag:flagOf(sb.status||'',sdd)}});
  const status=s.status||'';
  let flag=flagOf(status,dd),closedN=0;
  if(subs.length){
    closedN=subs.filter(x=>x.flag==='closed').length;
    flag=closedN===subs.length?'closed':subs.some(x=>x.flag==='overdue')?'overdue':subs.some(x=>x.flag==='wait')?'wait':subs.some(x=>x.flag==='soon')?'soon':'';
  }
  return{status,due,auto,dd,flag,subs,closedN,resp:s.resp||'',note:s.note||''};
}
/* Units for progress: every sub-task counts once; an activity without sub-tasks counts once. */
function units(ds){return ds.subs.length?ds.subs.map(x=>x.flag):[ds.flag]}
function phaseStats(p,ph){
  const r={total:0,closed:0,overdue:0,soon:0,wait:0};
  docsFor(p,ph).forEach(it=>units(docState(p,it)).forEach(f=>{r.total++;if(f==='closed')r.closed++;if(f==='overdue')r.overdue++;if(f==='soon')r.soon++;if(f==='wait')r.wait++}));
  r.pct=r.total?Math.round(r.closed/r.total*100):0;return r;
}
function stats(p){
  const r={total:0,closed:0,overdue:0,soon:0,wait:0};
  PHASES.forEach(ph=>{const s=phaseStats(p,ph);for(const k in r)r[k]+=s[k]});
  r.pct=r.total?Math.round(r.closed/r.total*100):0;r.open=r.total-r.closed;return r;
}

function renderMain(){
  const m=$('#main');
  if(editing){m.innerHTML=renderEditor();return}
  const p=cur();
  if(!p){m.innerHTML=`<section class="card editor"><h2>Sin proyectos</h2><p class="hint">Crea un proyecto para tener la lista completa de documentos de inicio, construcción y cierre.</p><div class="ed-actions"><button class="btn primary" type="button" data-act="new">+ Nuevo proyecto</button></div></section>`;return}
  m.innerHTML=view==='report'?renderReport(p):renderList(p);
}
function render(focusId){
  const a=document.activeElement;let keep=null;
  if(a&&a.id&&a.closest('#main')&&a.tagName==='INPUT')keep={id:a.id,s:a.selectionStart,e:a.selectionEnd,type:a.type};
  renderRail();renderMain();
  const fid=focusId||(keep&&keep.id);
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(!focusId&&keep.type==='text'&&keep.s!=null)try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}
function patch(k,obj,focusId){const p=cur();p.items=p.items||{};p.items[k]={...(p.items[k]||{}),...obj};persist();render(focusId)}
function patchSub(k,sid,obj,focusId){const p=cur();p.items=p.items||{};const it=p.items[k]=p.items[k]||{};it.subs=it.subs||{};it.subs[sid]={...(it.subs[sid]||{}),...obj};persist();render(focusId)}
let tt;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,3000)}

function reportText(p){
  const st=stats(p);const L=[`CONTROL DOCUMENTAL – ${p.code?p.code+' ':''}${p.name||''}`];
  if(p.scope)L.push(p.scope);if(p.client)L.push(`Cliente: ${p.client}`);
  if(p.end)L.push(`Entrega: ${fmt(parseD(p.end))}`);
  L.push(`Avance: ${st.pct}% (${st.closed} de ${st.total}) · Vencidos: ${st.overdue} · En espera: ${st.wait}`);
  const mk=(status)=>status==='rec'?'[✓]':status==='na'?'[N/A]':status==='esp'?'[EN ESPERA]':'[ ]';
  const tail=(flag,due,resp,note)=>`${flag!=='closed'&&due?` – vence ${fmtS(due)}${flag==='overdue'?' (VENCIDO)':''}`:''}${resp?` – ${resp}`:''}${note?` – ${note}`:''}`;
  PHASES.forEach(ph=>{const s=phaseStats(p,ph);L.push('',`${ph.title.toUpperCase()} – ${s.pct}%`);
    docsFor(p,ph).forEach(it=>{const d=docState(p,it);
      if(!d.subs.length){L.push(`${mk(d.status)} ${it.t}${tail(d.flag,d.due,d.resp,d.note)}`);return}
      L.push(`${it.t} (${d.closedN} de ${d.subs.length})`);
      d.subs.forEach(x=>L.push(`    ${mk(x.status)} ${x.sb.t}${tail(x.flag,x.due,x.sb.resp,x.sb.note)}`))})});
  L.push('',`Generado el ${fmt(today())}`);return L.join('\n');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.sel){state.sel=b.dataset.sel;editing=null;view='list';filter='all';persist();render();window.scrollTo({top:0});return}
  if(b.id==='newBtn'||b.dataset.act==='new'){editing='new';delArm=false;return render()}
  if(b.id==='resetBtn'){state.projects=state.projects.filter(p=>p.id!=='ejemplo');state.projects.unshift(sample());state.sel='ejemplo';editing=null;view='list';filter='all';persist();render();return toast('Ejemplo restablecido')}
  if(b.dataset.act==='edit'){editing=state.sel;delArm=false;return render()}
  if(b.dataset.act==='report'){view='report';render();return window.scrollTo({top:0})}
  if(b.dataset.act==='back'){view='list';return render()}
  if(b.dataset.act==='print'){try{window.print()}catch(err){}return}
  if(b.dataset.act==='copy'){const txt=reportText(cur());
    try{navigator.clipboard.writeText(txt).then(()=>toast('Reporte copiado. Pégalo en tu correo.'),()=>toast('No se pudo copiar en esta vista.'))}catch(err){toast('No se pudo copiar en esta vista.')}return}
  if(b.id==='edCancel'){editing=null;return render()}
  if(b.id==='edDelete'){if(!delArm){delArm=true;render();setTimeout(()=>{if(delArm){delArm=false;render()}},4000);return}
    state.projects=state.projects.filter(p=>p.id!==editing);delArm=false;editing=null;state.sel=state.projects[0]?.id||null;persist();render();return toast('Proyecto borrado')}
  if(b.dataset.filter){filter=filter===b.dataset.filter&&b.dataset.filter!=='all'?'all':b.dataset.filter;return render()}
  if(b.dataset.split){splitOpen.add(b.dataset.split);return render('as-'+b.dataset.split)}
  if(b.dataset.v){const k=b.dataset.k,sid=b.dataset.sub;
    if(sid){const now=(((cur().items||{})[k]||{}).subs||{})[sid]?.status||'';return patchSub(k,sid,{status:now===b.dataset.v?'':b.dataset.v})}
    const now=((cur().items||{})[k]||{}).status||'';return patch(k,{status:now===b.dataset.v?'':b.dataset.v})}
  if(b.dataset.rmsub)return patchSub(b.dataset.k,b.dataset.rmsub,{deleted:true});
  if(b.dataset.rm)return patch(b.dataset.rm,{deleted:true});
});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||!el.dataset.f||!cur())return;
  if(el.dataset.sub)return patchSub(el.dataset.k,el.dataset.sub,{[el.dataset.f]:el.value.trim()});
  patch(el.dataset.k,{[el.dataset.f]:el.value.trim()})});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='edForm'){
    const data={name:$('#f-name').value.trim(),scope:$('#f-scope').value.trim(),code:$('#f-code').value.trim(),client:$('#f-client').value.trim(),city:$('#f-city').value.trim(),
      start:$('#f-start').value,end:$('#f-end').value,director:$('#f-dir').value.trim(),resident:$('#f-res').value.trim()};
    if(editing==='new'){const p={id:'p'+uid(),...data,items:{}};state.projects.push(p);state.sel=p.id;toast('Proyecto creado')}
    else Object.assign(cur(),data);
    editing=null;view='list';filter='all';persist();return render();
  }
  if(f.dataset.addsub){const k=f.dataset.addsub;const inp=f.querySelector('input');const t=inp.value.trim();if(!t)return;
    splitOpen.delete(k);return patchSub(k,'s'+uid(),{t,status:'',created:Date.now()},'as-'+k)}
  if(f.dataset.add){const inp=f.querySelector('input');const t=inp.value.trim();if(!t)return;
    patch('c'+uid(),{custom:true,phase:f.dataset.add,text:t,created:Date.now()})}
});

load();
if(!state.projects.some(p=>p.id===state.sel))state.sel=state.projects[0]?.id||null;
render();
</script>
